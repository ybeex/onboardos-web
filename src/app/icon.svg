<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Matches LogoMark's segmented-ring design (components/ui/logo-mark.tsx)
    exactly, but with a literal color instead of currentColor — same
    documented exception as manifest.ts / apple-icon.tsx / layout.tsx's
    viewport.themeColor: this file is a standalone static asset with no
    access to the app's CSS cascade, so it can't reference a design
    token. Matches --palette-orange-600 exactly.
  -->
  <circle
    cx="20"
    cy="20"
    r="15"
    stroke="oklch(0.62 0.19 42)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="9 6.3"
  />
</svg>
